# Generated by engineering-standards plugin
# Detect project type and run appropriate linters, formatters, and tests

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  detect-project:
    runs-on: ubuntu-latest
    outputs:
      project-type: ${{ steps.detect.outputs.type }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f "package.json" ]; then echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then echo "type=go" >> $GITHUB_OUTPUT
          elif [ -f "Cargo.toml" ]; then echo "type=rust" >> $GITHUB_OUTPUT
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "Gemfile" ]; then echo "type=ruby" >> $GITHUB_OUTPUT
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then echo "type=java" >> $GITHUB_OUTPUT
          else echo "type=unknown" >> $GITHUB_OUTPUT
          fi

  lint:
    needs: detect-project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type: [node, go, rust, python, ruby, java]
    if: ${{ needs.detect-project.outputs.project-type == matrix.project-type }}
    steps:
      - uses: actions/checkout@v4

      - name: Node - lint
        if: matrix.project-type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node - install & lint
        if: matrix.project-type == 'node'
        run: |
          npm ci
          npx eslint . --max-warnings 0 || true
          npx tsc --noEmit || true

      - name: Go - lint
        if: matrix.project-type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Go - install & lint
        if: matrix.project-type == 'go'
        run: |
          go mod download
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Rust - lint
        if: matrix.project-type == 'rust'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Rust - install & lint
        if: matrix.project-type == 'rust'
        run: |
          cargo clippy -- -D warnings
          cargo fmt --check

      - name: Python - lint
        if: matrix.project-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python - install & lint
        if: matrix.project-type == 'python'
        run: |
          pip install ruff pytest
          ruff check .
          ruff format --check .

      - name: Ruby - lint
        if: matrix.project-type == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
      - name: Ruby - install & lint
        if: matrix.project-type == 'ruby'
        run: |
          bundle install --jobs 4 --retry 3
          bundle exec rubocop

      - name: Java - lint
        if: matrix.project-type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Java - install & lint
        if: matrix.project-type == 'java'
        run: ./gradlew spotlessCheck || ./mvnw spotless:check

  test:
    needs: detect-project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type: [node, go, rust, python, ruby, java]
    if: ${{ needs.detect-project.outputs.project-type == matrix.project-type }}
    steps:
      - uses: actions/checkout@v4

      - name: Node - test
        if: matrix.project-type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node - install & test
        if: matrix.project-type == 'node'
        run: |
          npm ci
          npm test || npx jest

      - name: Go - test
        if: matrix.project-type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Go - install & test
        if: matrix.project-type == 'go'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Rust - test
        if: matrix.project-type == 'rust'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Rust - install & test
        if: matrix.project-type == 'rust'
        run: cargo test

      - name: Python - test
        if: matrix.project-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python - install & test
        if: matrix.project-type == 'python'
        run: |
          pip install pytest
          pytest --cov=. --cov-report=xml

      - name: Ruby - test
        if: matrix.project-type == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
      - name: Ruby - install & test
        if: matrix.project-type == 'ruby'
        run: bundle exec rake spec

      - name: Java - test
        if: matrix.project-type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Java - install & test
        if: matrix.project-type == 'java'
        run: ./gradlew test || ./mvnw test

  security-scan:
    needs: detect-project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project-type: [node, python]
    if: ${{ needs.detect-project.outputs.project-type == matrix.project-type }}
    steps:
      - uses: actions/checkout@v4

      - name: Node - audit
        if: matrix.project-type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node - audit
        if: matrix.project-type == 'node'
        run: npm audit --audit-level=moderate || true

      - name: Python - audit
        if: matrix.project-type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python - audit
        if: matrix.project-type == 'python'
        run: pip install safety && safety check --json || true

  detect-size-violations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file sizes
        run: |
          FAILED=0
          for file in $(find . -name "*.go" -o -name "*.py" -o -name "*.ts" -o -name "*.tsx" -o -name "*.rs" -o -name "*.java" -o -name "*.rb" -o -name "*.kt" | grep -v node_modules | grep -v target | grep -v build | grep -v .venv); do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 550 ]; then
              echo "::warning::$file has $LINES lines (limit: 550)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 1 ] && exit 1 || echo "All files within size limits"
