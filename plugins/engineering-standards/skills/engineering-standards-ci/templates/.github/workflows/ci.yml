# Generated by engineering-standards plugin
#
# One detect step, then step-level conditions. Job-level `if` cannot read the
# `matrix` context (only github/needs/vars/inputs are available there), so a
# matrix leg compared against a detected type silently evaluates to false and
# every job skips — green CI that ran nothing.
#
# Adapt this to the project: delete the language blocks that do not apply, and
# replace the generic commands with the project's real scripts.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: read-only unless a step genuinely needs more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Engineering standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File size limit (550 lines)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 550 ]; then
              echo "::error file=$file::$file has $lines lines (limit: 550) — split by responsibility"
              failed=1
            fi
          done < <(git ls-files -z \
            '*.go' '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' '*.rs' '*.java' '*.kt' '*.rb' '*.cs' '*.php' \
            ':!:**/vendor/**' ':!:**/testdata/**' ':!:**/migrations/**' ':!:**/*.min.*' ':!:**/dist/**')
          exit "$failed"

  build:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          if   [ -f package.json ];   then type=node
          elif [ -f go.mod ];         then type=go
          elif [ -f Cargo.toml ];     then type=rust
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then type=python
          elif [ -f Gemfile ];        then type=ruby
          elif [ -f pom.xml ] || [ -f build.gradle ]; then type=java
          else type=unknown
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Detected: $type"

      - name: No project type detected
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "::error::No manifest found — cannot lint or test. Add one, or edit this workflow."
          exit 1

      # ---------- Node / TypeScript ----------
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'node'
        with:
          node-version: 20
          cache: npm
      - name: Node — install
        if: steps.detect.outputs.type == 'node'
        run: npm ci
      - name: Node — lint
        if: steps.detect.outputs.type == 'node'
        run: npm run lint
      - name: Node — typecheck
        if: steps.detect.outputs.type == 'node' && hashFiles('tsconfig.json') != ''
        run: npx tsc --noEmit
      - name: Node — test
        if: steps.detect.outputs.type == 'node'
        run: npm test

      # ---------- Go ----------
      - uses: actions/setup-go@v5
        if: steps.detect.outputs.type == 'go'
        with:
          go-version: stable
      - name: Go — lint
        if: steps.detect.outputs.type == 'go'
        uses: golangci/golangci-lint-action@v6
      - name: Go — test
        if: steps.detect.outputs.type == 'go'
        run: go test -race ./...

      # ---------- Rust ----------
      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.type == 'rust'
        with:
          components: clippy, rustfmt
      - name: Rust — lint
        if: steps.detect.outputs.type == 'rust'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust — test
        if: steps.detect.outputs.type == 'rust'
        run: cargo test

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.type == 'python'
        with:
          python-version: "3.12"
      - name: Python — install
        if: steps.detect.outputs.type == 'python'
        run: pip install -e . || pip install -r requirements.txt
      - name: Python — lint
        if: steps.detect.outputs.type == 'python'
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: Python — test
        if: steps.detect.outputs.type == 'python'
        run: |
          pip install pytest
          pytest

      # ---------- Ruby ----------
      - uses: ruby/setup-ruby@v1
        if: steps.detect.outputs.type == 'ruby'
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Ruby — lint
        if: steps.detect.outputs.type == 'ruby'
        run: bundle exec rubocop
      - name: Ruby — test
        if: steps.detect.outputs.type == 'ruby'
        run: bundle exec rake spec

      # ---------- Java / Kotlin ----------
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.type == 'java'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Java — lint & test
        if: steps.detect.outputs.type == 'java'
        run: |
          if [ -x ./gradlew ]; then ./gradlew spotlessCheck test; else ./mvnw spotless:check test; fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory ON PURPOSE: a new transitive advisory should not block an
    # unrelated PR. Remove continue-on-error to make it blocking — but never
    # hide it behind `|| true`, which swallows the signal entirely.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: npm audit
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
      - name: pip audit
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install pip-audit
          pip-audit
